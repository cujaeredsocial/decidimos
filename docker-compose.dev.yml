services:
  app:
    image: decidim/decidim:0.31.5
    working_dir: /code
    entrypoint: ["/code/bin/docker-entrypoint"]
    volumes:
      - .:/code
      - bundle:/usr/local/bundle
      - node_modules:/code/node_modules
    environment:
      - BOOT_SETUP=1
      - PORT=3000
      - ENZONA_CLIENT_ID=dev
      - ENZONA_CLIENT_SECRET=dev
      - DATABASE_HOST=pg
      - RAILS_ENV=development
      - DATABASE_USERNAME=postgres
      - DATABASE_PASSWORD=postgres
      - REDIS_URL=redis://redis:6379/1
      - DB_ADMIN_URL=http://pgweb:8081
      - DB_ADMIN_USER=${DB_ADMIN_USER:-dbadmin}
      - DB_ADMIN_PASSWORD=${DB_ADMIN_PASSWORD:-dbadmin}
    ports:
      - 3000:3000
    links:
      - pg
      - redis
      - pgweb
    command: bundle exec puma

  redis:
    image: redis:latest
    volumes:
      - redis-data:/data
  
  pg:
    image: postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD:-postgres}
    volumes:
      - pg-data:/var/lib/postgresql/data

  # DB admin UI served by the app at /db-admin (no published port on purpose)
  pgweb:
    image: sosedoff/pgweb:0.16.2
    command:
      - pgweb
      - --bind=0.0.0.0
      - --listen=8081
      - --prefix=pgweb
      - --skip-open
      - --lock-session
      - --url=postgres://postgres:${DATABASE_PASSWORD:-postgres}@pg:5432/decidim_cujae_development?sslmode=disable
      - --auth-user=${DB_ADMIN_USER:-dbadmin}
      - --auth-pass=${DB_ADMIN_PASSWORD:-dbadmin}
    ports:
      - 8081:8081
    restart: unless-stopped
    depends_on:
      - pg

volumes:
  node_modules: {}
  bundle: {}
  pg-data: {}
  redis-data: {}
  pgadmin-data: {}
